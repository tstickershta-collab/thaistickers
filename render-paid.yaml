services:
  - type: web
    name: thaistickers
    runtime: node
    plan: starter
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: ADMIN_PASSWORD
        sync: false
      - key: SITE_ORIGIN
        sync: false
      - key: DATA_DIR
        value: /var/data/thaistickers
    disk:
      name: thaistickers-images
      mountPath: /var/data
      sizeGB: 1
